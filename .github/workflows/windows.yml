name: Windows test and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[test,build]"
      - name: Test
        id: test
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Report test results
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\ci_annotate.py test-results.xml
      - name: Package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Smoke test packaged maintenance tool
        shell: pwsh
        run: |
          $empty = Join-Path $env:RUNNER_TEMP "vardiya-empty"
          & .\dist\VardiyaTakip\VardiyaBakim.exe --data-dir $empty --check
          if ($LASTEXITCODE -ne 1) { throw "Boş klasör reddedilmedi: $LASTEXITCODE" }
          $data = Join-Path $env:RUNNER_TEMP "vardiya-data"
          .\.venv\Scripts\python.exe scripts\make_sample_db.py $data
          if ($LASTEXITCODE -ne 0) { throw "Örnek veritabanı oluşturulamadı" }
          & .\dist\VardiyaTakip\VardiyaBakim.exe --data-dir $data --check
          if ($LASTEXITCODE -ne 0) { throw "Paketlenmiş bütünlük denetimi başarısız: $LASTEXITCODE" }
          Write-Host "::notice title=Paket::VardiyaBakim.exe gerçek bir veritabanını doğruladı ve boş klasörü reddetti."
          exit 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VardiyaTakip-Windows-x64
          path: dist/VardiyaTakip-Windows-x64.zip
          if-no-files-found: error
