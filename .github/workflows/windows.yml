name: Windows test and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write   # publishes review screenshots and the "son-surum" Windows release
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[test,build]"
      - name: Test
        id: test
        timeout-minutes: 15
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Report test results
        if: always()
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\ci_annotate.py test-results.xml
      - name: Screenshots
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $out = & .\.venv\Scripts\python.exe scripts\screenshots.py screenshots 2>&1
          if ($LASTEXITCODE -ne 0) {
            $text = (($out | Select-Object -Last 25) -join " / ") -replace "%", "%25"
            Write-Host "::error title=Ekran görüntüleri::$text"
            exit 1
          }
          Write-Host "::notice title=Ekran görüntüleri::$((Get-ChildItem screenshots).Count) dosya"
          exit 0
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Publish screenshots
        if: always() && github.event_name == 'push' && hashFiles('screenshots/*.png') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Ekran görüntüleri ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests
      - name: Smoke test packaged maintenance tool
        shell: pwsh
        run: |
          function Fail($message, $output) {
            $text = ($message + " | " + ($output -join " / ")) -replace "%", "%25"
            Write-Host "::error title=Paket::$text"
            exit 1
          }
          $exe = ".\dist\VardiyaTakip\VardiyaBakim.exe"
          $empty = Join-Path $env:RUNNER_TEMP "vardiya-empty"
          $out = & $exe --data-dir $empty --check 2>&1
          if ($LASTEXITCODE -ne 1) { Fail "Boş klasör reddedilmedi ($LASTEXITCODE)" $out }
          $data = Join-Path $env:RUNNER_TEMP "vardiya-data"
          $out = & .\.venv\Scripts\python.exe scripts\make_sample_db.py $data 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "Örnek veritabanı oluşturulamadı ($LASTEXITCODE)" $out }
          $out = & $exe --data-dir $data --check 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "Paketlenmiş bütünlük denetimi başarısız ($LASTEXITCODE)" $out }
          Write-Host "::notice title=Paket::VardiyaBakim.exe gerçek bir veritabanını doğruladı: $out"
          exit 0
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Host "::error title=Kurulum::Inno Setup bulunamadı"; exit 1 }
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $out = & $iscc "/DAppVersion=$version" installer\VardiyaTakip.iss 2>&1
          if ($LASTEXITCODE -ne 0) {
            $text = (($out | Select-Object -Last 15) -join " / ") -replace "%", "%25"
            Write-Host "::error title=Kurulum::$text"; exit 1
          }
          Write-Host "::notice title=Kurulum::VardiyaTakip-Kurulum.exe $version hazır"
          exit 0
      - name: Smoke test installer
        shell: pwsh
        run: |
          $setup = Get-Item dist\VardiyaTakip-Kurulum.exe
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Kurulum::Sessiz kurulum başarısız ($($p.ExitCode))"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\VardiyaTakip"
          foreach ($f in "VardiyaTakip.exe", "VardiyaBakim.exe", "_internal\vardiya\assets\logo.png", "unins000.exe") {
            if (-not (Test-Path (Join-Path $app $f))) { Write-Host "::error title=Kurulum::Eksik: $f"; exit 1 }
          }
          $data = Join-Path $env:RUNNER_TEMP "vardiya-installed"
          & .\.venv\Scripts\python.exe scripts\make_sample_db.py $data | Out-Null
          $out = & (Join-Path $app "VardiyaBakim.exe") --data-dir $data --check 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Kurulum::Kurulu bakım aracı: $out"; exit 1 }
          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $app "VardiyaTakip.exe")) { Write-Host "::error title=Kurulum::Kaldırma dosyaları silmedi"; exit 1 }
          if (-not (Test-Path (Join-Path $data "vardiya.sqlite3"))) { Write-Host "::error title=Kurulum::Kaldırma veriyi sildi"; exit 1 }
          Write-Host "::notice title=Kurulum::Sessiz kurulum, kurulu .exe ve kaldırma doğrulandı; veri korundu"
          exit 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VardiyaTakip-Windows-x64
          path: dist/VardiyaTakip-Windows-x64.zip
          if-no-files-found: error
      - name: Publish Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Windows 10/11 x64 · Python gerekmez · yönetici izni gerekmez.

          Kurulum: VardiyaTakip-Kurulum.exe dosyasını indirip çift tıklayın, İleri → Kur.
          'Windows bilgisayarınızı korudu' uyarısında Ek bilgi → Yine de çalıştır'ı seçin (uygulama imzalı değil).
          Yeni sürüm eski sürümün üzerine kurulur; kayıtlar (%LOCALAPPDATA%\\VardiyaTakip) korunur.

          Kurulumsuz kullanım: VardiyaTakip-Windows-x64.zip → sağ tık → Tümünü ayıkla → ayıklanan klasördeki VardiyaTakip.exe.
          Sürüm: ${GITHUB_SHA::7}"
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum dist/VardiyaTakip-Kurulum.exe dist/VardiyaTakip-Windows-x64.zip \
            --title "Vardiya Takip · Windows son sürüm" --notes "$notes" --target "$GITHUB_SHA" --latest
