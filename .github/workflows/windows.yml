name: Windows test and package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Test and build
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VardiyaTakip-Windows-x64
          path: dist/VardiyaTakip-Windows-x64.zip
          if-no-files-found: error
